# Server Port
server.port=8081

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/pjsoft_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root123

# Hibernate (Recreate the schema locally so stale rows from previous runs do not break FK constraints)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB