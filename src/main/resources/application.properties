# Server Port
server.port=8081

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/pjsoft_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root123

# Keep registration and payment records across backend restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Razorpay and admin credentials are supplied by the backend environment.
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.admin.password=${ADMIN_PASSWORD:}

# Enable only when loading fictional demo members into a local development database.
app.sample-data.enabled=${APP_SAMPLE_DATA_ENABLED:false}