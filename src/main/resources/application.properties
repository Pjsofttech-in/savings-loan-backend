# Server Port
server.port=8081

# Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/pjsoft_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root123

# Keep registration and payment records across backend restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Payment configuration is supplied by the backend environment.
app.registration.fee=${REGISTRATION_FEE:0}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}