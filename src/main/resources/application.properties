# ---------- Server ----------
server.port=8081
server.error.include-message=always
# Stops Tomcat from resetting the TCP connection (ERR_CONNECTION_RESET) when an upload is rejected
server.tomcat.max-swallow-size=-1

# ---------- Database ----------
# Override with environment variables in production (DB_URL, DB_USERNAME, DB_PASSWORD).
# The default password below is for local development ONLY - change it and do not use it on a server.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pjsoft_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root123}

# Keep registration and payment records across backend restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- File uploads (3 ID documents per registration) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ---------- CORS ----------
# Comma separated list of browser origins allowed to call this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://localhost:3000,https://wayabroad.in}

# ---------- Payments / admin ----------
app.registration.fee=${REGISTRATION_FEE:0}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.admin.password=${ADMIN_PASSWORD:}

# Demo data (set APP_SAMPLE_DATA_ENABLED=true for local development only)
app.sample-data.enabled=${APP_SAMPLE_DATA_ENABLED:false}
