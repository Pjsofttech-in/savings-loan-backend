spring.application.name=SankalpApplication

server.port=${SERVER_PORT:8081}

# ==========================
# DATABASE CONFIGURATION
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sankalpapp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Pikachu@24680}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:info.pjsofttech@gmail.com}
spring.mail.password=${MAIL_PASSWORD:nnoo sdza mqex mpdm}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:300000}

# FILE UPLOAD
spring.servlet.multipart.enabled=${MULTIPART_ENABLED:true}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:210MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:210MB}
spring.servlet.multipart.file-size-threshold=${MULTIPART_FILE_SIZE_THRESHOLD:2KB}

# SPRING BOOT ACTUATOR
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSURE:*}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:always}

# Razorpay Configuration
app.razorpay.key-id=${RAZORPAY_KEY:acv}
app.razorpay.key-secret=${RAZORPAY_SECRET:scv}

# Payment configuration is supplied by the backend environment.
app.registration.fee=${REGISTRATION_FEE:0}

# AWS S3 — no keys needed, EC2 instance role handles auth
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:library-management-uploads}
aws.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN:d2ae418ok1z2jw.cloudfront.net}